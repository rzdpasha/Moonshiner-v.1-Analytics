stages:
  - clone
  - setup
  - deploy
  - restart

variables:
  PROJECT_DIR: "/home/www/moonshiner"
  VENV: "$PROJECT_DIR/venv"
  PYTHON: "$VENV/bin/python"
  PIP: "$VENV/bin/pip"
  GIT_STRATEGY: none

clone_repository:
  stage: clone
  tags:
    - dash
  script:
    - git config --global --add safe.directory "$PROJECT_DIR"
    - |
      if [ ! -d "$PROJECT_DIR/.git" ]; then
        echo "Клонируем репозиторий..."
        git clone git@gitlab.com:rzdpasha/moonshiner.git "$PROJECT_DIR"
      else
        echo "Обновляем существующий репозиторий..."
        cd "$PROJECT_DIR"
        git fetch origin
        git reset --hard origin/main
      fi

setup_environment:
  stage: setup
  tags:
    - dash
  script:
    - cd "$PROJECT_DIR"
    - python3 -m venv "$VENV"
    - $PIP install --upgrade pip
    - $PIP install -r requirements.txt
      
deploy:
  stage: deploy
  tags:
    - dash
  script:
    - cd "$PROJECT_DIR"
    - $PYTHON manage.py collectstatic --noinput --clear
    - $PYTHON manage.py migrate --noinput

restart_services:
  stage: restart
  tags:
    - dash
  script:
    # Причесываем права (исключая venv)
    - sudo find "$PROJECT_DIR" -path "$PROJECT_DIR/venv" -prune -o -exec chown www:webdev {} +
    - sudo find "$PROJECT_DIR" -path "$PROJECT_DIR/venv" -prune -o -type d -exec chmod 775 {} +
    - sudo find "$PROJECT_DIR" -path "$PROJECT_DIR/venv" -prune -o -type f -exec chmod 664 {} +
    
    - sudo systemctl daemon-reload
    - sudo systemctl restart gunicorn
#    - sudo systemctl reload angie
